<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets">
<ui:composition>
<f:view>
	<h:head>
		<title>JavaServer Faces aplikazioa</title>
		<h:outputScript library="js" name="infoJavaScript.js" />
		<!-- JS exekutatu orria exekutazean -->

	</h:head>
	<h:body>
		<h:form>
			<h3>
				Ongi etorri JavaServer Faces-era,
				<h:outputText value="#{login.izena}" />
				!
				<p>
					Data:
					<h:outputText value="#{login.data}" />
				</p>
			</h3>
		</h:form>
		<h:commandButton value="Onartu"
			onclick="showMessage('Ez dago definituta nora joan')"> <!-- Goiko funtzioak hemen ere -->
		</h:commandButton>
	</h:body>
</f:view>
</ui:composition>
</html>
